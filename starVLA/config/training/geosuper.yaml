# Qwen-GeoSuper 训练配置文件
# 文件名：starVLA/config/training/geosuper.yaml

run_id: qwen-geosuper
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: jinhuiye
wandb_project: starVLA_geosuper
is_debug: false

# 硬件配置
hardware:
  device: "cuda"
  num_gpus: 8
  mixed_precision: true
  memory_efficient: true
  gradient_checkpointing: true
  gradient_accumulation_steps: 2
  distributed_strategy: "deepspeed_zero2"

# ==================== 框架配置 ====================
framework:
  name: "Qwen-GeoSuper"
  
  # VLM 配置
  qwenvl:
    base_vlm: /data/models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    trainable_layers: [28, 29, 30, 31]  # 只微调最后4层
  
  # DINO 配置
  dino:
    dino_backbone: dinov2_vits14
    trainable: false  # 默认冻结
  
  # MapAnything 配置
  map_anything:
    model_repo_id: "facebook/map-anything-apache"
    input_modes: ["images"]
    return_patch_tokens: true
    return_scale_token: true
    trainable: false  # 默认冻结
  
  # 几何感知模块配置
  geometric_fusion:
    # 交叉注意力融合
    cross_attention:
      num_heads: 8
      hidden_dim: 2048
      dropout: 0.1
      use_bidirectional: true
      use_scale_gate: true
    
    # 自我中心变换
    egocentric_transform:
      enabled: true
      robot_state_dim: 7
      hidden_dim: 2048
    
    # 可供性感知
    affordance_module:
      enabled: true
      num_affordances: 8
      hidden_dim: 512
    
    # 物理约束
    physical_constraints:
      enabled: true
      collision_threshold: 0.05
      velocity_limit: 1.0
      smoothness_weight: 0.1
  
  # 动作模型配置
  action_model:
    action_model_type: "PhysicallyConstrainedFlowMatching"
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 2048
    action_dim: 7
    state_dim: 7
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 1
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 64
    
    # 物理约束参数
    collision_threshold: 0.05
    velocity_limit: 1.0
    smoothness_weight: 0.1
    joint_limit_weight: 0.05
    use_physical_constraints: true
    
    # DiT 配置
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

# ==================== 数据集配置 ====================
datasets:
  # VLM 数据（保持不变）
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: asv2_conversation_en,asv2_detailed_description_en
    eval_dataset: aokvqa_cauldron_llava_format
    data_flatten: false
    base_interval: 2
    max_pixels: 50176
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4
  
  # VLA 数据（机器人数据）
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /data/dataset/OXE_LEROBOT_DATASET
    data_mix: bridge_rt_1
    action_type: delta_ee
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: [224,224]
    
    # 几何数据增强
    geometric_augmentation:
      enabled: true
      random_crop: true
      color_jitter: true
      random_flip: false
    
    # 机器人状态
    include_robot_state: true
    robot_state_format: "joint_positions"  # 或 "end_effector"

# ==================== 训练器配置 ====================
trainer:
  # 基础训练参数
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  logging_frequency: 10
  
  # 训练策略
  training_strategy: "curriculum"  # curriculum, end2end, selective
  curriculum_stage: 0  # 0, 1, 2
  
  # 学习率配置
  learning_rate:
    base: 4e-5
    qwen_vl_interface: 4e-5
    action_model: 4e-4
    geometric_modules: 4e-4
    map_anything: 1e-5
  
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5e-7
  
  # 课程学习配置
  curriculum_learning:
    enabled: true
    stages:
      - name: "stage0_baseline"
        max_steps: 10000
        freeze_modules: ["qwen_vl_interface.model.model.visual", "dino_encoder", "map_encoder", "affordance_module", "ego_geom_transform"]
        loss_weights:
          action: 1.0
          affordance: 0.0
          physical: 0.0
      
      - name: "stage1_geometric_fusion"
        max_steps: 50000
        freeze_modules: ["qwen_vl_interface.model.model.visual", "dino_encoder"]
        loss_weights:
          action: 1.0
          affordance: 0.1
          physical: 0.05
      
      - name: "stage2_full_constraints"
        max_steps: 100000
        freeze_modules: []
        loss_weights:
          action: 1.0
          affordance: 0.15
          physical: 0.1
  
  # 损失权重
  loss_weights:
    action_loss_weight: 1.0
    affordance_loss_weight: 0.1
    physical_constraint_weight: 0.05
    geometric_consistency_weight: 0.02
  
  # 优化器配置
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  
  # 梯度配置
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  
  # 混合精度
  enable_mixed_precision_training: true
  mixed_precision_dtype: "bfloat16"
  
  # 梯度检查点（节省内存）
  enable_gradient_checkpointing: true
  gradient_checkpointing_modules: ["qwen_vl_interface", "action_model", "geometric_fusion"]
  
  # 冻结模块（CLI可覆盖）
  freeze_modules: ""
  
  # 恢复训练
  is_resume: false
  resume_epoch: null
  resume_step: null
  pretrained_checkpoint: null
  reload_modules: null

# ==================== 评估配置 ====================
evaluation:
  # 评估任务
  task_types: ["pick_and_place", "push", "stack"]
  
  # 几何感知评估指标
  geometric_metrics:
    - name: "affordance_match_score"
      threshold: 0.7
      weight: 1.0
    
    - name: "collision_rate"
      threshold: 0.1
      weight: 0.5
    
    - name: "trajectory_smoothness"
      threshold: 0.05
      weight: 0.3
  
  # 可视化
  visualization:
    enabled: true
    save_attention_maps: true
    save_geometric_features: true
    visualization_frequency: 100

# ==================== 监控配置 ====================
monitoring:
  # 损失监控
  log_loss_components: true
  loss_components: ["total_loss", "action_loss", "affordance_loss", "physical_constraint_loss"]
  
  # 几何特征监控
  log_geometric_features: true
  geometric_features: ["scale_factor", "affordance_scores", "attention_weights", "ego_geom_embeddings"]
  
  # 性能监控
  log_performance_metrics: true
  performance_metrics: ["inference_time", "memory_usage", "throughput"]
  
  # 训练状态监控
  log_training_state: true
  training_state_metrics: ["learning_rate", "gradient_norm", "parameter_updates"]

# ==================== 实验跟踪 ====================
experiment_tracking:
  experiment_name: "Qwen-GeoSuper-Curriculum"
  experiment_description: "Geometric-aware VLA with curriculum learning"
  experiment_tags: ["vla", "geometric", "mapanything", "curriculum", "robot"]
  version: "1.0.0"
  git_commit: "auto"
  log_all_hyperparameters: true